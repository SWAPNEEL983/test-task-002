name: Daily Commit Workflow

on:
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * *'

permissions:
  contents: write

jobs:
  # --- THE MODIFICATION IS HERE ---
  auto-commit-job:
    # We are adding the email to the JOB NAME
    name: Automated commit job - 23f3000343@ds.study.iitm.ac.in
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create daily commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          echo "Last automated update: $(date)" > automated_update.log
          
          git add automated_update.log
          # We'll leave the commit message clean, in case that was confusing it
          git commit -m "Automated daily update [skip ci]"

      - name: Push changes
        run: |
          git push
