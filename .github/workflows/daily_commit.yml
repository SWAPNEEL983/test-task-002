# We'll keep the name simple, as the email in the name failed.
name: Daily Commit Workflow

on:
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * *'

permissions:
  contents: write

jobs:
  auto-commit-job:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # This step name literally follows the prompt's instructions
      - name: Create daily commit - 23f3000343@ds.study.iitm.ac.in
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          echo "Last automated update: $(date)" > automated_update.log
          
          git add automated_update.log
          
          # --- MODIFICATION IS HERE ---
          # We will add the email to the commit message itself.
          git commit -m "Automated daily update 23f3000343@ds.study.iitm.ac.in [skip ci]"

      - name: Push changes
        run: |
          git push
