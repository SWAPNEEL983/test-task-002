# MODIFICATION: Email is now in the top-level workflow name
name: Daily Commit Workflow - 23f3000343@ds.study.iitm.ac.in

on:
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * *'

permissions:
  contents: write

jobs:
  auto-commit-job:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # This step name is now simpler, as the email is in the main name
      - name: Create daily commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          echo "Last automated update: $(date)" > automated_update.log
          
          git add automated_update.log
          git commit -m "Automated daily update [skip ci]"

      - name: Push changes
        run: |
          git push
